<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe-Raz-Project</title>
    <link rel="stylesheet" href="./project1.css">
</head>
<body>
    
    <h1>Hello welcome to my project work -tic tac toe game</h1>
<h2>I hope you will enjoy the game 😃</h2>
<div id="controlls">
 
  <div id="mode">
    <h3>play with friend or computer?</h3>
    <label>
        <input type="radio" name="game-mode" value="player" id="player" > <b>play with friend</b></label>
         <label>
        <input type="radio" name="game-mode" value="computer" id="computer"><b>play with computer</b></label>
     </div>
    
     <h3 id="message">is the turn of X</h3>
     
      <button type="reset" id="reset"><b>play game</b></button>


</div>
<br>
<div id="board">
    <div class="cell" data-index="0"></div> 
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div> 
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div> 
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div> 
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div> 
    

</div>

     <script  type="text/javascript" src="./project1.js"></script>
</body>
</html>
